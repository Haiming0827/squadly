name: squadly_integration_test
description: "Squadly device integration test host."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cloudbase_flutter: ^1.2.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  squadly:
    path: ..

dev_dependencies:
  path_provider: ^2.1.6
  fpdart: ^1.1.1
  shared_preferences: ^2.5.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
