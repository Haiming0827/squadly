name: squadly
description: "小分队 — 专为 2-9 人封闭亲密小圈子打造的生活协作 App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.9.0

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 路由
  go_router: ^14.8.1

  # 不可变数据
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # 本地存储
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.32
  shared_preferences: ^2.5.3

  # 网络（第三方 API 用）
  dio: ^5.8.0+1

  # 函数式错误处理
  fpdart: ^1.1.0

  # UI 辅助
  cupertino_icons: ^1.0.8
  intl: ^0.20.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # 社交登录
  sign_in_with_apple: ^6.1.4

  # 工具
  uuid: ^4.5.1
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 代码生成
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  drift_dev: ^2.25.0

  # 测试
  mocktail: ^1.0.4

  # 代码质量
  flutter_lints: ^6.0.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
