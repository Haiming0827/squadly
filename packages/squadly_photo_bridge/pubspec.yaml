name: squadly_photo_bridge
description: User-selected, metadata-free still photo preparation for Squadly.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SquadlyPhotoBridgePlugin
