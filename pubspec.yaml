name: squadly
description: "小分队 — 专为 2-9 人封闭亲密小圈子打造的生活协作 App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # 路由
  go_router: ^14.8.1

  # 不可变数据
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # 本地存储
  drift: ^2.34.4
  sqlite3: ^3.7.1
  sqlite3_flutter_libs: ^0.5.32
  shared_preferences: ^2.5.3

  # 网络（第三方 API 用）
  dio: ^5.8.0+1
  http: ^1.6.0
  postgrest: ^2.7.0
  connectivity_plus: ^7.3.2

  # 函数式错误处理
  fpdart: ^1.1.0

  # UI 辅助
  cupertino_icons: ^1.0.8
  intl: ^0.20.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # 社交登录
  sign_in_with_apple: ^8.2.0

  # 工具
  uuid: ^4.5.1
  logger: ^2.5.0
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.4
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  gal: ^2.3.3
  health: ^13.3.2
  health_connect_bridge:
    path: packages/health_connect_bridge
  squadly_photo_bridge:
    path: packages/squadly_photo_bridge
  squadly_widget_bridge:
    path: packages/squadly_widget_bridge
  file_selector: ^1.1.0
  xml: ^6.6.1
  # Target backend SDK. PostgreSQL REST is wrapped with Dio in core/network.
  cloudbase_flutter: ^1.2.2
  sentry: 10.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # 代码生成
  build_runner: ^2.15.1
  freezed: ^4.0.3
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  drift_dev: ^2.34.0

  # 测试
  mocktail: ^1.0.4
  yaml: ^3.1.4

  # 代码质量
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.9

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
